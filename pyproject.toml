[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-shortcut-portal"
version = "0.2.0"
description = "Python library for the Wayland Global Shortcut Portal (xdg-desktop-portal)"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "marvin1099", email = "marvin1099@noreply.codeberg.org" },
]
requires-python = ">=3.10"
dependencies = [
    "dbus-next>=0.2.3",
]
keywords = ["wayland", "global-shortcuts", "xdg-desktop-portal", "hotkeys"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://codeberg.org/marvin1099/python-global-shortcut-portal"
Repository = "https://codeberg.org/marvin1099/python-global-shortcut-portal"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
